services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpnshiki}
      POSTGRES_USER: ${POSTGRES_USER:-vpnshiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnshiki_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpnshiki} -d ${POSTGRES_DB:-vpnshiki}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vpnshiki}:${POSTGRES_PASSWORD:-vpnshiki_dev_password}@postgres:5432/${POSTGRES_DB:-vpnshiki}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      X_UI_API_URL: ${X_UI_API_URL:-}
      X_UI_TOKEN: ${X_UI_TOKEN:-}
      X_UI_SUBSCRIPTION_URL: ${X_UI_SUBSCRIPTION_URL:-https://85.208.87.191:8888/gatewaysubru}
      YOOMONEY_ENABLED: ${YOOMONEY_ENABLED:-false}
      YOOMONEY_RECEIVER: ${YOOMONEY_RECEIVER:-}
      YOOMONEY_NOTIFICATION_SECRET: ${YOOMONEY_NOTIFICATION_SECRET:-}
      YOOMONEY_ACCESS_TOKEN: ${YOOMONEY_ACCESS_TOKEN:-}
      YOOMONEY_RECONCILIATION_ENABLED: ${YOOMONEY_RECONCILIATION_ENABLED:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
