[project]
name = "vpnshiki-backend"
version = "0.1.0"
description = "Backend API for VPNщики"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
